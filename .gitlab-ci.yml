include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "templates/tagged-release.yaml"
      - "jobs/container-build-direct-buildkit.yaml"
      - "jobs/container-publish-direct.yaml"
  # Opt-in AI review of merge requests. Requires AI_REVIEW_TOKEN (api scope)
  # and OPENAI_API_KEY; the component defaults both to group variables under
  # /univention, so define them in this project when running from a personal
  # namespace.
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.22.0"

variables:
  IMAGE_NAME: "cerbos"
  # In a project without the dependency proxy, override GO_IMAGE and
  # BUILDKIT_DOCKER_PROXY, or move the project into a group with the proxy
  # enabled.
  # Pinned by digest: every new Go toolchain invalidates the whole build cache, and the digest is part of its key.
  # Upstream's CI takes the newest 1.27 patch (.github/actions/setup-go/action.yaml: 1.27.x, check-latest);
  # bump GO_VERSION and GO_IMAGE_DIGEST together, and the minor version when upstream's go.mod does.
  GO_VERSION: "1.27.4"
  GO_IMAGE_DIGEST: "sha256:5e8afd493a7124a8586e134d9b532731161d4b9becf9dee5a5956b107426f93d"
  GO_IMAGE: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:${GO_VERSION}@${GO_IMAGE_DIGEST}"
  # Built by ci-go-image from docker/ci-go/Dockerfile: the Go toolchain, the module cache, and a warm build cache.
  CI_GO_IMAGE: "${CI_REGISTRY_IMAGE}/ci-go:latest"
  GOMODCACHE: "${CI_PROJECT_DIR}/.go/mod"
  GOCACHE: "${CI_PROJECT_DIR}/.go/build"
  # Restoring and uploading the Go caches took longer than compiling and testing.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  # Only protected refs write the Go caches; workflow rules switch both to pull-push.
  GOMOD_CACHE_POLICY: "pull"
  GOBUILD_CACHE_POLICY: "pull-push"

.go-cache:
  cache:
    - &gomod-cache
      key:
        prefix: "gomod-v2"
        files:
          - "go.sum"
          - "hack/tools/testsplit/go.sum"
      paths:
        - ".go/mod/"
      # build-cerbos downloads every module the tests need, so its copy of the cache is complete.
      policy: "$GOMOD_CACHE_POLICY"
    - key: "gobuild-${CI_JOB_NAME_SLUG}-${GO_IMAGE_DIGEST}"
      paths:
        - ".go/build/"
      policy: "$GOBUILD_CACHE_POLICY"

# Replaces common-ci's shared nubus-workflow: release pipelines are driven by
# protected "vX.Y.Z-nubusN" tags. Pushes to protected "*-univention" branches
# run CI and publish their branch image. Pushes to main (the upstream mirror)
# run nothing; feature branches run only merge-request pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "schedule-release"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-nubus[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        GOMOD_CACHE_POLICY: "pull-push"
        GOBUILD_CACHE_POLICY: "pull-push"
    - if: '$CI_COMMIT_BRANCH =~ /-univention$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        GOMOD_CACHE_POLICY: "pull-push"
        GOBUILD_CACHE_POLICY: "pull-push"
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "jlohmer/cerbos-release-pipeline-experiments"'

# Rebuilds CI_GO_IMAGE on a protected branch when its Dockerfile changes. The child pipeline runs
# common-ci's gitregistry buildkit job, whose hidden jobs clash with the direct flow included here.
ci-go-image:
  stage: ".pre"
  variables:
    CI_GO_IMAGE: "${CI_GO_IMAGE}"
  trigger:
    include:
      - local: "ci/ci-go-image.yml"
    strategy: "depend"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /-univention$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - "docker/ci-go/Dockerfile"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "docker/ci-go/Dockerfile"
    - if: '$CI_COMMIT_BRANCH == "jlohmer/cerbos-release-pipeline-experiments"'
      changes:
        - "docker/ci-go/Dockerfile"

# Release version stamp from common-ci's .tagged-release: a protected
# "vX.Y.Z-nubusN" tag yields RELEASE_VERSION "X.Y.Z-nubusN" and
# PUBLIC_RELEASE "true"; every other ref is a "<base>-post-<slug>" dev build
# published to nubus-dev only. The job name is "pre-semantic-release" because
# container-release-attestation needs it by that name.
pre-semantic-release:
  extends: ".tagged-release"
  variables:
    RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+-nubus[0-9]+$'
    INITIAL_VERSION: "0.57.0"
  # A release tag must sit on top of the upstream tag of the same version,
  # otherwise it was cut on the wrong *-univention branch.
  before_script:
    - |
      set -eu
      if printf '%s' "${CI_COMMIT_TAG:-}" | grep -qE "${RELEASE_TAG_PATTERN}"; then
        UPSTREAM_TAG="${CI_COMMIT_TAG%%-nubus*}"
        git fetch --quiet origin "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
        if ! git merge-base --is-ancestor "${UPSTREAM_TAG}" HEAD; then
          echo "ERROR: release tag '${CI_COMMIT_TAG}' is not based on upstream tag '${UPSTREAM_TAG}'."
          exit 1
        fi
        echo "Release tag ${CI_COMMIT_TAG} is based on upstream tag ${UPSTREAM_TAG}."
      fi

# Build flags and ldflags mirror the "cerbos" build in .goreleaser.yml:
# CGO_ENABLED=0, -trimpath, -s -w, and the Version/Commit/BuildDate -X
# flags. GOAMD64 is v1 because goreleaser's goamd64 target (default v1)
# overrides the GOAMD64=v2 in its env, so upstream releases are v1; v2
# fails to start on VMs with generic CPU models. The values are the CI
# equivalents of goreleaser's .Version/.FullCommit/.Date, with Version taken
# from pre-semantic-release's RELEASE_VERSION; the telemetry -X
# flags are omitted. -buildvcs=false is CI-only and keeps the build
# independent of the Git checkout; goreleaser embeds VCS info.
# No Go build cache: on dae-l, restoring it took 109 s and the compile it saved 4 s.
build-cerbos:
  cache:
    - *gomod-cache
  stage: "build"
  image: "$GO_IMAGE"
  tags:
    - "dae-l"
  needs:
    - job: "pre-semantic-release"
      artifacts: true
  variables:
    CGO_ENABLED: "0"
    GOAMD64: "v1"
  script:
    - |
      # Fetches what the tests compile, 1.6 GB; "go mod download" fetches all workspace modules, 3.5 GB.
      go list -deps -test -tags=tests ./... > /dev/null
      GOWORK=off go mod download -C hack/tools/testsplit
      mkdir -p docker/cerbos
      VERSION="${RELEASE_VERSION:?}"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      go build -trimpath -buildvcs=false \
        -ldflags "-s -w \
          -X github.com/cerbos/cerbos/internal/util.Version=${VERSION} \
          -X github.com/cerbos/cerbos/internal/util.Commit=${CI_COMMIT_SHA} \
          -X github.com/cerbos/cerbos/internal/util.BuildDate=${BUILD_DATE}" \
        -o docker/cerbos/cerbos ./cmd/cerbos
      ./docker/cerbos/cerbos --version
  artifacts:
    name: "cerbos-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "docker/cerbos/cerbos"
    expire_in: "1 week"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "manual"'
      when: "never"
    - when: "on_success"

test-cerbos:
  extends: ".go-cache"
  stage: "test"
  image: "$GO_IMAGE"
  # Compiling and testing with -race are CPU-bound; dae-l has more CPU and memory than the default runner.
  tags:
    - "dae-l"
  timeout: "1h"
  parallel: 3
  # Starts the tests at once instead of after the build stage, which they do not use.
  needs: []
  variables:
    CGO_ENABLED: "1"
    GODEBUG: "gocachetest=1"
  script:
    - |
      set -euo pipefail
      echo "nproc=$(nproc) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo none)"; grep -E "MemTotal|MemAvailable" /proc/meminfo
      GOWORK=off GOBIN=/tmp/bin go install -C hack/tools/testsplit
      export PATH="/tmp/bin:${PATH}"
      cp ci/testsplit-times.json test-times.json
      # The blob and overlay tests, and upstream's integration-tagged tests,
      # start containers through dockertest; the runner has no Docker.
      testsplit split --kind=tests --index="$((CI_NODE_INDEX - 1))" --total="$CI_NODE_TOTAL" \
        --ignore-file=.ignore-packages.yaml \
        | grep -v -E '^github.com/cerbos/cerbos/internal/storage/(blob|overlay|git|db|db/postgres)$' \
        > packages.txt
      # Go keys a cached test result on the size and mtime of every file the test opens, and a fresh
      # clone gives every file a new mtime; derive it from the blob hash so it changes with the content.
      git ls-files -s | while read -r _ hash _ path; do touch -h -m -d "@$((946684800 + 16#${hash:0:7}))" "$path"; done
      find . -path ./.git -prune -o -path ./.go -prune -o -type d -exec touch -m -d @946684800 {} +
      TIMEFORMAT='%R s real, %U s user, %S s sys'
      echo "compile:"
      time xargs -r go test -tags=tests -race -count=1 -p 4 -run '^$' < packages.txt > /dev/null
      echo "test:"
      time xargs -r go test -tags=tests -race -failfast -p 4 -timeout=30m < packages.txt
  rules:
    - when: "on_success"
      #- if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "manual"'
      #  when: "never"
      #- when: "on_success"

# Runs every test again, ignoring the cached results test-cerbos reuses.
test-cerbos-uncached:
  extends: "test-cerbos"
  cache:
    - *gomod-cache
    - key: "gobuild-test-cerbos-${CI_NODE_INDEX}-${CI_NODE_TOTAL}-${GO_IMAGE_DIGEST}"
      paths:
        - ".go/build/"
      policy: "pull"
  variables:
    GOFLAGS: "-count=1"
  rules:
    - when: "manual"
      allow_failure: true

# Exercises the built binary rather than the sources: the policy test suites
# through "cerbos compile", then a server start with a health check.
smoke-cerbos:
  stage: "test"
  image: "$GO_IMAGE"
  needs:
    - job: "build-cerbos"
      artifacts: true
  script:
    - |
      set -eu
      echo "nproc=$(nproc) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo none)"; grep -E "MemTotal|MemAvailable" /proc/meminfo
      ./docker/cerbos/cerbos compile internal/test/testdata/store
      # TODO add our sandbox tests here https://git.knut.univention.de/univention/dev/sandbox/cerbos-sandbox
      ./docker/cerbos/cerbos server --config=hack/dev/conf.insecure.yaml > cerbos.log 2>&1 &
      tries=0
      until ./docker/cerbos/cerbos healthcheck --config=hack/dev/conf.insecure.yaml --kind=http; do
        tries=$((tries + 1))
        [ "$tries" -lt 30 ] || exit 1
        sleep 1
      done
  artifacts:
    when: "always"
    paths:
      - "cerbos.log"
    expire_in: "1 week"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - when: "on_success"

container-build:
  stage: "package"
  needs:
    - job: "pre-semantic-release"
      artifacts: true
    - job: "build-cerbos"
      artifacts: true
      #- job: "test-cerbos"
      #  artifacts: false

# common-ci's rule "if: $PUBLIC_RELEASE" never matches: the variable comes from
# pre-semantic-release's dotenv, which does not exist when GitLab evaluates rules.
# The tests do not gate the copy; nubus is not a release until Guardian and nubus-helm ship it.
promote-image-public:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-nubus[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  needs:
    - job: "pre-semantic-release"
      artifacts: true
    - job: "container-build"
      artifacts: true

# Signs the public image, so on a release it has to wait for promote-image-public;
# on other refs it skips signing.
container-sign-external:
  needs:
    - job: "pre-semantic-release"
      artifacts: true
    - job: "container-build"
      artifacts: true
    - job: "promote-image-public"
      artifacts: false
      optional: true
