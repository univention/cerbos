# The LDAP schema that ldapDN() and ldapDNList() use when the engine globals
# hold no ldapSchema. It has the format of that global, so it also serves as
# the starting point for one: a subset of the attribute types of RFC 4519 and
# RFC 4524 that are common in RDNs.

unknownAttributeTypes: exact
attributeTypes:
  - oid: 0.9.2342.19200300.100.1.1
    names: [uid, userid]
    match: ignoreCase
  - oid: 0.9.2342.19200300.100.1.3
    names: [mail, rfc822Mailbox]
    match: ignoreCase
  - oid: 0.9.2342.19200300.100.1.25
    names: [dc, domainComponent]
    match: ignoreCase
  - oid: 2.5.4.3
    names: [cn, commonName]
    match: ignoreCase
  - oid: 2.5.4.4
    names: [sn, surname]
    match: ignoreCase
  - oid: 2.5.4.5
    names: [serialNumber]
    match: ignoreCase
  - oid: 2.5.4.6
    names: [c, countryName]
    match: ignoreCase
  - oid: 2.5.4.7
    names: [l, localityName]
    match: ignoreCase
  - oid: 2.5.4.8
    names: [st, stateOrProvinceName]
    match: ignoreCase
  - oid: 2.5.4.9
    names: [street, streetAddress]
    match: ignoreCase
  - oid: 2.5.4.10
    names: [o, organizationName]
    match: ignoreCase
  - oid: 2.5.4.11
    names: [ou, organizationalUnitName]
    match: ignoreCase
  - oid: 2.5.4.12
    names: [title]
    match: ignoreCase
  - oid: 2.5.4.13
    names: [description]
    match: ignoreCase
  - oid: 2.5.4.17
    names: [postalCode]
    match: ignoreCase
  - oid: 2.5.4.41
    names: [name]
    match: ignoreCase
  - oid: 2.5.4.42
    names: [givenName, gn]
    match: ignoreCase
  - oid: 2.5.4.43
    names: [initials]
    match: ignoreCase
  - oid: 2.5.4.44
    names: [generationQualifier]
    match: ignoreCase
  - oid: 2.5.4.46
    names: [dnQualifier]
    match: ignoreCase
